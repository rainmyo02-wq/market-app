name: Shop Zone - Android Build CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            ccache \
            unzip \
            zip \
            python3-dev \
            libssl-dev \
            libffi-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            cmake

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "cython<3.0.0" buildozer

      - name: Build Android APK
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopzone-apk
          path: bin/*.apk

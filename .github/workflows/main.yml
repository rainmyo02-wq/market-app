name: Shop Zone - Android Build CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # APK Build ပြုလုပ်သည့် Step (Flet/Kivy/Buildozer အသုံးပြုထားပါက)
      - name: Build Android APK
        run: |
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk
          # Buildozer သို့မဟုတ် မိမိ App ထုတ်သည့် Command ထည့်ပါ
          # buildozer -v android release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-zone-apk
          path: bin/*.apk # သို့မဟုတ် Build ထွက်သည့် APK Path

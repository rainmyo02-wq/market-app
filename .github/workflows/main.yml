name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Clean directory
        run: git clean -xfd

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies & Bundle Requests
        run: |
          python -m pip install --upgrade pip
          pip install flet-cli
          pip install requests -t requests_module
          python -c "import os, shutil; shutil.copytree('requests_module/requests', 'requests', dirs_exist_ok=True); shutil.copytree('requests_module/urllib3', 'urllib3', dirs_exist_ok=True); shutil.copytree('requests_module/idna', 'idna', dirs_exist_ok=True); shutil.copytree('requests_module/certifi', 'certifi', dirs_exist_ok=True); shutil.copytree('requests_module/charset_normalizer', 'charset_normalizer', dirs_exist_ok=True)"

      - name: Build APK
        run: flet build apk --yes

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk

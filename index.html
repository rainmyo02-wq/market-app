<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Amazon-style Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Navigation Bar -->
  <nav class="bg-gray-900 text-white p-4 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0 z-50">
    <div class="text-2xl font-bold text-amber-500">ShopZone</div>
    <div class="w-full sm:w-1/2 flex">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search products..." class="w-full p-2 rounded-l-md text-black focus:outline-none">
      <button class="bg-amber-500 text-black px-4 py-2 rounded-r-md font-semibold hover:bg-amber-600">Search</button>
    </div>
    <button onclick="toggleCart()" class="relative bg-gray-800 p-2 rounded-md hover:bg-gray-700 flex items-center gap-2">
      🛒 Cart
      <span id="cartCount" class="bg-amber-500 text-black text-xs font-bold px-2 py-0.5 rounded-full">0</span>
    </button>
  </nav>

  <!-- Banner -->
  <div class="bg-slate-800 text-white text-center py-8 px-4 mb-6">
    <h1 class="text-3xl font-bold mb-2">Welcome to ShopZone</h1>
    <p class="text-gray-300">Find the best products at the lowest prices!</p>
  </div>

  <!-- Main Container -->
  <div class="max-w-6xl mx-auto px-4 pb-12">
    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Products will be injected by JavaScript -->
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl relative">
      <h2 class="text-xl font-bold mb-4 border-b pb-2">Your Shopping Cart</h2>
      <div id="cartItems" class="max-h-60 overflow-y-auto mb-4 space-y-2">
        <!-- Cart Items -->
      </div>
      <div class="flex justify-between font-bold text-lg border-t pt-2 mb-4">
        <span>Total:</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="toggleCart()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400">Close</button>
        <button onclick="checkout()" class="px-4 py-2 bg-amber-500 text-black font-semibold rounded-md hover:bg-amber-600">Checkout</button>
      </div>
    </div>
  </div>

  <script>
    // Sample Product Data
    const products = [
      { id: 1, name: "Wireless Headphones", price: 49.99, image: "https://via.placeholder.com/200?text=Headphones" },
      { id: 2, name: "Smart Watch", price: 89.99, image: "https://via.placeholder.com/200?text=Smartwatch" },
      { id: 3, name: "Gaming Mouse", price: 25.50, image: "https://via.placeholder.com/200?text=Mouse" },
      { id: 4, name: "Mechanical Keyboard", price: 65.00, image: "https://via.placeholder.com/200?text=Keyboard" },
      { id: 5, name: "Bluetooth Speaker", price: 35.00, image: "https://via.placeholder.com/200?text=Speaker" },
      { id: 6, name: "USB-C Hub", price: 19.99, image: "https://via.placeholder.com/200?text=USB+Hub" }
    ];

    let cart = [];

    // Render Products
    function renderProducts(items) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = items.map(p => `
        <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col justify-between p-4">
          <img src="${p.image}" alt="${p.name}" class="w-full h-40 object-cover rounded-md mb-4">
          <div>
            <h3 class="font-semibold text-lg mb-1">${p.name}</h3>
            <p class="text-amber-600 font-bold text-xl mb-3">$${p.price.toFixed(2)}</p>
          </div>
          <button onclick="addToCart(${p.id})" class="w-full bg-amber-500 text-black py-2 rounded-md font-medium hover:bg-amber-600 transition">Add to Cart</button>
        </div>
      `).join('');
    }

    // Filter Products Search
    function filterProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    // Add to Cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      cart.push(product);
      updateCartUI();
    }

    // Update Cart Modal and Counter
    function updateCartUI() {
      document.getElementById("cartCount").innerText = cart.length;
      const cartItems = document.getElementById("cartItems");
      
      if (cart.length === 0) {
        cartItems.innerHTML = "<p class='text-gray-500 text-center'>Your cart is empty.</p>";
      } else {
        cartItems.innerHTML = cart.map((item, index) => `
          <div class="flex justify-between items-center border-b pb-2">
            <span>${item.name}</span>
            <div class="flex items-center gap-3">
              <span class="font-bold">$${item.price.toFixed(2)}</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 font-bold hover:text-red-700">✕</button>
            </div>
          </div>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById("cartTotal").innerText = `$${total.toFixed(2)}`;
    }

    // Remove from Cart
    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    // Toggle Cart Modal
    function toggleCart() {
      const modal = document.getElementById("cartModal");
      modal.classList.toggle("hidden");
      modal.classList.toggle("flex");
    }

    // Checkout
    function checkout() {
      if(cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      alert("Order placed successfully! Thank you for buying.");
      cart = [];
      updateCartUI();
      toggleCart();
    }

    // Initialize
    renderProducts(products);
  </script>
</body>
</html>
